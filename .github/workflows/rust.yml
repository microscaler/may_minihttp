name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lints:
    name: Lints (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [lints]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - name: default
            cargo_args: ""
          - name: client
            cargo_args: "--features client"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run unit tests with nextest
        shell: bash
        run: |
          mkdir -p target/nextest
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 \
            cargo nextest run --workspace --all-targets --all-features \
              -E 'not binary(goose_header_load_test)' \
              --message-format libtest-json \
              2>&1 \
            > target/nextest/unit-${{ matrix.name }}-${{ matrix.os }}.json
      - name: Run integration tests with nextest
        if: matrix.name == 'client'
        shell: bash
        run: |
          mkdir -p target/nextest
          export RUST_BACKTRACE=${{ matrix.os == 'windows-latest' && '1' || 'full' }}
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 \
            cargo nextest run \
              --test client_integration \
              --test header_traffic_integration \
              ${{ matrix.cargo_args }} \
              --message-format libtest-json 2>&1 \
            > target/nextest/integration-${{ matrix.name }}-${{ matrix.os }}.json

  goose-load-tests:
    name: Goose load tests
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-goose-${{ hashFiles('**/Cargo.lock') }}
      - name: Run Goose load tests
        run: cargo test --test goose_header_load_test -- --nocapture
      - name: Check for Goose reports
        if: always()
        id: check_reports
        run: |
          if [ -f "goose-report.html" ] || [ -f "goose-report.json" ] || ls goose-*.txt 2>/dev/null; then
            echo "reports_exist=true" >> $GITHUB_OUTPUT
          else
            echo "reports_exist=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload Goose reports
        if: always() && steps.check_reports.outputs.reports_exist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goose-reports
          path: |
            goose-*.html
            goose-*.json
            goose-*.txt
          retention-days: 7

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [lints, tests, goose-load-tests]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lints | ${{ needs.lints.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Goose load tests | ${{ needs.goose-load-tests.result }} |" >> $GITHUB_STEP_SUMMARY
