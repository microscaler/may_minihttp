name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    name: Lints (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [lints]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - name: default
            cargo_args: ""
          - name: client
            cargo_args: "--features client"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run unit tests with nextest
        shell: bash
        run: |
          mkdir -p target/nextest
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 \
            cargo nextest run --workspace --all-targets --all-features \
              --message-format libtest-json \
              2>&1 \
            > target/nextest/unit-${{ matrix.name }}-${{ matrix.os }}.json
      - name: Run integration tests with nextest
        if: matrix.name == 'client'
        shell: bash
        run: |
          mkdir -p target/nextest
          # On Windows, set RUST_BACKTRACE=1 for richer error output
          export RUST_BACKTRACE=${{ matrix.os == 'windows-latest' && '1' || 'full' }}
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 \
            cargo nextest run \
              --test client_integration \
              --test header_traffic_integration \
              ${{ matrix.cargo_args }} \
              --message-format libtest-json 2>&1 \
            > target/nextest/integration-${{ matrix.name }}-${{ matrix.os }}.json
